<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Happy Remixer</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <header>
      <div class="logo"></div>
      <div>
        <div class="title">Happy Remixer</div>
        <div class="sub">remix this video with AI</div>
      </div>
    </header>

    <div class="status-row">
      <span class="dot" id="dot"></span>
      <span id="status-text" class="status-text">Checking…</span>
    </div>

    <div class="actions">
      <button id="open-tiktok" class="primary">Open TikTok</button>
      <button id="open-options">Settings</button>
    </div>

    <div class="hint" id="hint"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
