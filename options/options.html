<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Happy Remixer — Settings</title>
<link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="card">
    <header>
      <div class="logo"></div>
      <div>
        <h1>Happy Remixer</h1>
        <p class="sub">remix TikTok &amp; Dreamina videos with AI</p>
      </div>
    </header>

    <section class="field">
      <label for="apiKey">Anthropic API key</label>
      <div class="input-row">
        <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off" spellcheck="false">
        <button id="toggleVis" type="button" title="Show / hide" aria-label="Show / hide">show</button>
      </div>
      <p class="hint">Stored locally in <code>chrome.storage.local</code>. Get one at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com/settings/keys</a>.</p>
    </section>

    <section class="field">
      <label for="model">Model</label>
      <select id="model">
        <option value="claude-sonnet-4-6">Claude Sonnet 4.6 (default — fast, smart)</option>
        <option value="claude-opus-4-7">Claude Opus 4.7 (smartest, slower)</option>
        <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5 (fastest, cheapest)</option>
      </select>
    </section>

    <div class="row">
      <button id="save" class="primary">Save</button>
      <button id="test" type="button">Test connection</button>
      <span id="status" class="status"></span>
    </div>

    <footer>
      <p class="muted">
        Open any TikTok or Dreamina video and tap the <strong>Remix</strong> button to start.
        Frames are sent to Anthropic to generate captions, scripts, and edit ideas.
      </p>
    </footer>
  </main>

  <script src="options.js"></script>
</body>
</html>
